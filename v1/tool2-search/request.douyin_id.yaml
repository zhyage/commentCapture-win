# ============================================================
# request.douyin_id.yaml — 抖音号模式测试配置 (工具2)
# 输入: 抖音号列表 (与 keywords 互斥, 不允许同时填写)
# 流程: 搜索定位抖音号 → 进主页 → 全量翻页 → 两段式过滤 → 输出截断到 limit
# ============================================================

# 抖音号 (可多条, 串行处理)
douyin_id:
  - 55008743593
  - YNHHFB

# 发布时间范围 (null=不限)
after: null
before: null

# 互动数下限 (null=不限)
min_likes: 1000
min_comments: null

# 限定发布账号 (抖音号模式下通常无需设置; 主页本来就是该号)
authors: null

# 排序: 抖音号模式主页无排序, 此字段被忽略
sort: likes

# 结果条数上限: **每个抖音号各自**的截断 — 每号全量翻页+逐条判定(LLM不省),
# 每号内部按点赞数降序取前 limit 条, 合并输出 (多号时每号各 limit, 总数 = limit × 号数)
limit: 50

# 软条件 (可选, 语义意图; 任一符合即命中)
describe: 景点介绍, 景点推荐, 民俗

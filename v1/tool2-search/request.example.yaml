# ============================================================
# smsearch 搜索需求模板 (工具2: 筛选器)
# 用法: 复制本文件为 request.yaml, 填写条件, 然后运行:
#     smsearch request.yaml [--out urls.txt]
# 说明: 本工具在搜索阶段做"去留"过滤, 输出尽量精确的 URL 清单交给工具1 采集。
#       带 "近似" 标注的字段为近似判定, 详见输出中的 honesty_notes。
# ============================================================

# ---- 1. 输入 (二选一, 不允许同时填写) ----
# 方式A: keywords — 平台搜索词 (多个 = 或关系, 各词独立搜索后合并去重)
#        关键词仅作为"搜索词"使用, 不做主题硬过滤 —— 内容相关性由 describe 语义判定。
# 方式B: douyin_id — 抖音号列表 (如 55008743593; 可多条, 串行处理逐号过滤后合并)
#        流程: 搜索定位该抖音号 → 进入其主页 → 全量翻页获取该号所有作品(无排序)
#              → 与方式A相同的两段式过滤 → 输出截断到 limit
keywords: null
douyin_id: null
#  示例 (方式A):
#    keywords:
#      - 云南文旅
#  示例 (方式B):
#    douyin_id:
#      - 55008743593

# ---- 2. 硬条件 (过滤; 留 null 表示不限) ----
# 硬过滤只处理客观字段: 作者 / 时间 / 互动数。内容是否相关交给 describe 语义判定。
# 发布时间范围 (YYYY-MM-DD, 按结果的 create_time 精确过滤)
after: null
before: null

# 互动数下限 (关键词模式按点赞排序后从顶部取, 低于阈值即停; 抖音号模式为全量后本地过滤)
min_likes: 10000
min_comments: null

# 限定发布账号 (昵称或抖音号, 可多个; 精确匹配作者名; 抖音号模式下通常无需设置)
authors: null

# 排序方式 (仅关键词模式生效; 抖音号模式主页无排序, 此字段被忽略)
#   likes        按点赞(默认, 配合 min_likes 使用)
#   latest       按最新
#   comprehensive 综合(平台默认)
sort: likes

# 结果条数上限
#   关键词模式: 命中达到 limit 即提前终止翻页
#   抖音号模式: 每号全量翻页并逐条判定(不省 LLM), 每号内部按点赞数降序取前 limit 条
#               (多号时每号各 limit, 总数 = limit × 号数)
limit: 50

# ---- 3. 软条件 (可选) ----
# 描述性需求 → 语义意图列表 (DeepSeek 批量判定, 任一意图符合即命中):
# 如 "景点介绍, 景点推荐, 民俗"。留空则只做硬过滤。
# 若涉及 口播内容/视觉/签名 等条件, 本工具无法判定(诚实性说明会标注, 需工具1采集后二次过滤)。
describe: null

# ---- 4. 输出 ----
# 默认在当前目录生成 results.json + urls.txt + collected.json/collected_review.md
# 也可用命令行: smsearch request.yaml --out /path/to/urls.txt

# ============================================================
# Text Liveness 词表 v0.2  ——  ⚠️ 待研究者审阅/增删
# ============================================================
# 用途: 工具3 统计引擎计算"文本活人感"的词典密度(可复现、零模型)
# 口径说明:
#   - 只做**字符串命中**, 不做分词/词性/语义 → 结果完全可复现
#   - 匹配规则: 长词优先、非重叠计数(避免"我们"被"我"重复计数)
#   - 文本先做**繁→简归一化**(zhconv), 再匹配(ASR 偶尔输出繁体字)
#   - 词表属于**研究操作化定义**的一部分: 增删词会改变指标值(需重算, 零成本)
#   - 与 LLM 标注互补: 词典给"密度"(连续变量, 可进 PCA/因子), LLM 给"有/无+理由"
#
# 维度对应 idea.md:
#   first_person → HCI1 人格化
#   colloquial   → HCI2 口语化
#   emotion      → Text Liveness 情绪
#   slang        → Text Liveness 网络语言
#   meme         → HCI3 幽默化(玩梗)
#   rhetorical   → Text Liveness 反问(句式, 用正则)
#
# v0.2 变更(2026-09-09): 在 v0.1 种子表基础上, 按**汉语口语/情绪的语言学标记**
#   扩充(不照抄 LLM 判定结果, 避免循环拟合); 新增词以 # [v0.2] 标注, 便于回退。
# ============================================================


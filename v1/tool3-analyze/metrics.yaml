# 工具3 指标库 (Metric Registry) — 能力边界的唯一真相来源
# 字段: metric_id / name / level(video|comment) / engine(stat|llm|derived) / inputs / method / v0 / reliability
# 规则: 指标必须能追溯到工具1 产出的字段; 追溯不到的进 not_available 区

version: "0.2"
generated: "2026-09-09"

metrics:
  # ========== 视频层 · 基础 (stat) ==========
  - {metric_id: video_id, name: 视频ID, level: video, engine: stat, inputs: [platform_item_id], method: 直接读取, v0: true}
  - {metric_id: author, name: 作者昵称, level: video, engine: stat, inputs: [author.nickname], method: 直接读取, v0: true}
  - {metric_id: duration_sec, name: 视频时长, level: video, engine: stat, inputs: [media.duration_seconds], method: 直接读取, v0: true}
  - {metric_id: publish_date, name: 发布日期, level: video, engine: stat, inputs: [publish_time], method: 直接读取, v0: true}
  - {metric_id: publish_weekday, name: 发布星期, level: video, engine: stat, inputs: [publish_time], method: 派生, v0: true}
  - {metric_id: publish_hour, name: 发布小时, level: video, engine: stat, inputs: [publish_time], method: 派生, v0: true}
  - {metric_id: is_holiday, name: 是否节假日, level: video, engine: stat, inputs: [publish_time, holiday_calendar], method: 查国务院节假日表, v0: true, reliability: "仅收录2024-2026; 未收录年份返回空(不猜)"}
  - {metric_id: holiday_name, name: 节日名, level: video, engine: stat, inputs: [publish_time], method: 查节假日表, v0: true, reliability: 同上}
  - {metric_id: is_weekend, name: 是否周末, level: video, engine: stat, inputs: [publish_time], method: 星期判断, v0: true}
  - {metric_id: is_makeup_workday, name: 是否调休上班日, level: video, engine: stat, inputs: [publish_time], method: 查调休表, v0: true, reliability: "调休上班的周末"}
  - {metric_id: is_rest_day, name: 是否休息日, level: video, engine: stat, inputs: [publish_time], method: 放假日或(周末且非调休), v0: true}

  # ========== 视频层 · 账号维度 (研究总体过滤; 口径见 accounts.yaml) ==========
  - {metric_id: account_uid, name: 作者UID, level: video, engine: stat, inputs: [author.id], method: 直接读取, v0: true}
  - {metric_id: account_status, name: 账号判定, level: video, engine: stat, inputs: [author.id, author.certification, accounts.yaml], method: "白名单+认证关键词规则", v0: true, reliability: "target/borderline/non_target/unknown; 口径见 accounts.yaml"}
  - {metric_id: is_target_account, name: 是否目标账号, level: video, engine: stat, inputs: [account_status], method: 派生, v0: true, reliability: "研究总体过滤键; unknown → 空(不下断言)"}
  - {metric_id: sample_role, name: 样本分层, level: video, engine: stat, inputs: [account_status, sample_policy], method: 查 sample_policy, v0: true, reliability: "main=主样本 / robustness=稳健性对照 / excluded / undetermined; 口径见 accounts.yaml"}
  - {metric_id: account_admin_type, name: 账号主体类型, level: video, engine: stat, inputs: [accounts.yaml], method: 读取, v0: true, reliability: "文旅局/融媒体中心/个人IP/企业品牌等"}
  - {metric_id: account_level, name: 行政层级, level: video, engine: stat, inputs: [accounts.yaml], method: 读取, v0: true, reliability: "省级/地市/县区; 仅白名单账号有值"}
  - {metric_id: account_province, name: 所属省份, level: video, engine: stat, inputs: [accounts.yaml], method: 读取, v0: true, reliability: 同上}
  - {metric_id: account_region, name: 所属大区, level: video, engine: stat, inputs: [accounts.yaml], method: 读取, v0: true, reliability: "东/中/西/东北; 地区异质性分析用"}

  # ========== 视频层 · 互动 (stat) ==========
  - {metric_id: likes, name: 点赞数, level: video, engine: stat, inputs: [stats.likes], method: 直接读取, v0: true}
  - {metric_id: comments_n, name: 评论数, level: video, engine: stat, inputs: [stats.comments], method: 直接读取, v0: true}
  - {metric_id: collects, name: 收藏数, level: video, engine: stat, inputs: [stats.collects], method: 直接读取, v0: true}

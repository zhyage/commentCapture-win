  # ========== 视频层 · 官方互动 (stat, 核心) ==========
  - {metric_id: author_reply_n, name: 官方回复数, level: video, engine: stat, inputs: [comments.is_author], method: 计数, v0: true, reliability: "依赖评论采集覆盖率"}
  - {metric_id: reply_rate, name: 官方回复率, level: video, engine: stat, inputs: [comments.is_author, comments.parent_id], method: 被回复顶层评论/顶层评论, v0: true, reliability: "依赖评论采集覆盖率; 漏采会低估"}
  - {metric_id: reply_speed_p25_min, name: 回复速度P25, level: video, engine: stat, inputs: [comments.created_at], method: 分位(分钟), v0: true, reliability: "仅对有配对的作者回复; 样本少时不稳定"}
  - {metric_id: reply_speed_p50_min, name: 回复速度P50, level: video, engine: stat, inputs: [comments.created_at], method: 分位(分钟), v0: true, reliability: 同上}
  - {metric_id: reply_speed_p75_min, name: 回复速度P75, level: video, engine: stat, inputs: [comments.created_at], method: 分位(分钟), v0: true, reliability: 同上}
  - {metric_id: reply_speed_p90_min, name: 回复速度P90, level: video, engine: stat, inputs: [comments.created_at], method: 分位(分钟), v0: true, reliability: 同上}
  - {metric_id: reply_text_len_avg, name: 官方回复平均字数, level: video, engine: stat, inputs: [comments.is_author, comments.text], method: 均值, v0: true}
  - {metric_id: reply_emoji_rate, name: 回复含emoji率, level: video, engine: stat, inputs: [comments.is_author, comments.text], method: 比例, v0: true}
  - {metric_id: reply_at_rate, name: "回复含@率", level: video, engine: stat, inputs: [comments.is_author, comments.text], method: 比例, v0: true}
  - {metric_id: author_engaged_comments, name: 被回复评论数, level: video, engine: stat, inputs: [author_engagement.replied_comment_count], method: 直接读取, v0: true}

  # ========== 视频层 · 评论群体 (stat) ==========
  - {metric_id: comment_len_avg, name: 评论平均字数, level: video, engine: stat, inputs: [comments.text], method: 均值, v0: true, reliability: "仅代表采到的评论"}
  - {metric_id: comment_len_median, name: 评论字数中位, level: video, engine: stat, inputs: [comments.text], method: 中位数, v0: true}
  - {metric_id: comment_emoji_rate, name: 评论含emoji率, level: video, engine: stat, inputs: [comments.text], method: 比例, v0: true}
  - {metric_id: comment_question_rate, name: 评论问句率, level: video, engine: stat, inputs: [comments.text], method: "顶层评论中含?的比例", v0: true}

  - {metric_id: subtitle_source, name: 字幕来源, level: video, engine: stat, inputs: [subtitles.source], method: 直接读取, v0: true}

  # ========== 视频层 · Text Liveness 词典密度 (stat, 纯字符串可复现) ==========

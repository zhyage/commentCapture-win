  - {metric_id: tl_cap_emotion, name: "文本活人感·情绪(文案)", level: video, engine: stat, inputs: [caption], method: 词表+emoji命中, v0: true, reliability: 同上}
  - {metric_id: tl_all_emotion, name: "文本活人感·情绪(文案+字幕)", level: video, engine: stat, inputs: [caption, subtitles.llm.json], method: 同上, v0: true, reliability: 同上}
  - {metric_id: tl_cap_slang, name: "文本活人感·网络语言(文案)", level: video, engine: stat, inputs: [caption], method: 词表命中, v0: true, reliability: "只测网络流行语词; 网络词时效性强, 词表需随年份更新; 与 tl_llm_slang 非同一构念"}
  - {metric_id: tl_all_slang, name: "文本活人感·网络语言(文案+字幕)", level: video, engine: stat, inputs: [caption, subtitles.llm.json], method: 同上, v0: true, reliability: 同上}
  - {metric_id: tl_cap_meme, name: "文本活人感·玩梗(文案)", level: video, engine: stat, inputs: [caption], method: 词表命中, v0: true, reliability: "只测「引用具体梗」, 覆盖有限; 与 tl_llm_meme(更宽的幽默化)非同一构念"}
  - {metric_id: tl_all_meme, name: "文本活人感·玩梗(文案+字幕)", level: video, engine: stat, inputs: [caption, subtitles.llm.json], method: 同上, v0: true, reliability: 同上}
  - {metric_id: tl_cap_rhetorical, name: "文本活人感·反问(文案)", level: video, engine: stat, inputs: [caption], method: 正则句式, v0: true, reliability: "与疑问句区分靠句式模板"}
  - {metric_id: tl_all_rhetorical, name: "文本活人感·反问(文案+字幕)", level: video, engine: stat, inputs: [caption, subtitles.llm.json], method: 同上, v0: true, reliability: 同上}
  - {metric_id: tl_index_cap, name: "文本活人感指数(文案, 等权)", level: video, engine: stat, inputs: [tl_cap_*], method: "6维是否出现的均值", v0: true, reliability: "等权版; PCA/因子版由研究端自算"}

  - {metric_id: engage_ratio, name: 评论点赞比, level: video, engine: stat, inputs: [stats.comments, stats.likes], method: comments/likes, v0: true}

  # ========== 视频层 · 文案 (stat) ==========
  - {metric_id: caption_len, name: 文案字数, level: video, engine: stat, inputs: [caption], method: 字符数, v0: true}
  - {metric_id: hashtag_count, name: 话题标签数, level: video, engine: stat, inputs: [hashtags], method: 计数, v0: true}
  - {metric_id: mention_count, name: "文案@提及数", level: video, engine: stat, inputs: [caption], method: 正则计数, v0: true}
  - {metric_id: caption_emoji, name: 文案emoji数, level: video, engine: stat, inputs: [caption], method: 正则计数, v0: true}
  - {metric_id: caption_question, name: 文案问句数, level: video, engine: stat, inputs: [caption], method: 正则计数, v0: true}

  # ========== 视频层 · 账号 (stat) ==========
  - {metric_id: followers, name: 粉丝数, level: video, engine: stat, inputs: [author.follower_count], method: 直接读取, v0: true}
  - {metric_id: total_favorited, name: 获赞总数, level: video, engine: stat, inputs: [author.total_favorited], method: 直接读取, v0: true}
  - {metric_id: is_verified, name: 是否认证, level: video, engine: stat, inputs: [author.certification], method: 非空判断, v0: true}
  - {metric_id: signature_len, name: 签名长度, level: video, engine: stat, inputs: [author.signature], method: 字符数, v0: true}

  # ========== 视频层 · 评论覆盖 (stat, 可信度关键) ==========
  - {metric_id: comments_collected, name: 已采评论数, level: video, engine: stat, inputs: [comments.collected_count], method: 直接读取, v0: true}

  # 双通道: _cap = 仅文案(作者亲写, 无 ASR 噪声); _all = 文案+口播字幕
  - {metric_id: tl_cap_first_person, name: "文本活人感·第一人称(文案)", level: video, engine: stat, inputs: [caption], method: 词表命中(长词优先非重叠), v0: true, reliability: "词表 v0.2 可调; 只做字符串匹配不做语义; 已繁→简归一化"}
  - {metric_id: tl_all_first_person, name: "文本活人感·第一人称(文案+字幕)", level: video, engine: stat, inputs: [caption, subtitles.llm.json], method: 同上, v0: true, reliability: "字幕为 LLM 修正版; 仍可能残留 ASR 错字"}
  - {metric_id: tl_cap_colloquial, name: "文本活人感·口语化(文案)", level: video, engine: stat, inputs: [caption], method: 词表命中, v0: true, reliability: 同上}

# ============================================================
# 目标账号白名单与判定规则 (工具3)
# ============================================================
# 用途: 给每条视频打 `account_status`, 让研究端能过滤"非目标账号"的数据,
#       避免样本被个人号/品牌号/混入内容污染(2026-09-09 实测已发现 4 条)。
#
# 判定优先级(自上而下, 命中即停):
#   1. manual_overrides[uid]        —— 人工裁决, 优先级最高
#   2. accounts[uid].status         —— 白名单显式登记
#   3. rule.target_cert_keywords    —— 认证主体含文旅行政关键词 → target
#   4. rule.borderline_cert_keywords—— 认证为融媒体/广电/报社 → borderline(待人工确认)
#   5. 其余                          —— non_target
#
# status 语义:
#   target      符合"文旅官方账号"总体(文旅行政/事业单位主体)
#   borderline  主体不是文旅局而是地方官方发布平台(融媒体中心等) → 需研究端决定去留
#   non_target  个人 IP / 企业品牌号 / 达人博主 → 不应进入研究样本
#   unknown     信息不足
#
# ⚠️ 易混淆点: 一些"非目标"视频是通过**目标号主页翻页混入**的(非本人作品但很相关),
#    它们的 uid 依然不是目标账号 → 一律判 non_target, 但 reason 里注明来源。
# ============================================================

version: "0.1"
generated: "2026-09-09"

# ============================================================
# 样本分层口径(研究端决定, 2026-09-09)
# ============================================================
# 决定: 云南红河发布(融媒体中心)不污染主样本, 也不丢弃 —— 留作稳健性对照。
#   主样本       = target                     (严格符合 idea.md "文旅官方账号")
#   稳健性对照   = borderline                 (政务/融媒体发布号; 检验结论是否随总体口径变化)
#   排除         = non_target / unknown
# 产出列: sample_role ∈ main | robustness | excluded | undetermined
sample_policy:
  main: [target]
  robustness: [borderline]
  excluded: [non_target]
  undetermined: [unknown]
  decided_at: "2026-09-09"
  decided_by: 用户
  note: "主样本用 target; borderline 仅在稳健性检验时纳入, 论文需说明总体口径"
  # 地区口径(2026-09-11 用户决定): 接受当前地区不平衡, 不做地区异质性分析。
  # 现状: 西部 7 / 中部 1 / 东部 1 → region 仅作控制变量, 不作为异质性分组依据。
  # 若后续补东部/中部账号, 应同步更新本注记与报告说明。
  region_policy:
    decided_at: "2026-09-11"
    decided_by: 用户
    decision: accept_imbalance
    note: "地区样本不足以做东中西部对比 → account_region 仅作控制变量; 报告须写明未做地区异质性"

rule:
  # 任一命中 → target。注意: 各省厅名写法不一, 必须覆盖"文化广电和旅游厅"(浙江)这类变体,
  # 否则会出现假阴性(实测: 浙江省文化广电和旅游厅官方 → 曾误判 non_target)。
  # 因此以"旅游厅/旅游局"为核心锚点, 再列常见完整写法。
  target_cert_keywords:
    - 文化和旅游厅
    - 文化和旅游局
    - 文化广电和旅游厅
    - 文化广电和旅游局
    - 广播电视和旅游局
    - 旅游发展委员会
    - 旅游厅              # 锚点: 覆盖 "文化广电和旅游厅" 等变体
    - 旅游局              # 锚点: 覆盖 "广播电视和旅游局" 等变体
    - 文旅局
    - 文化和旅游
    - 文旅集团
  # 命中 → borderline(非文旅行政主体; 典型为地方新闻/政务发布平台)
  borderline_cert_keywords:
    - 融媒体中心
    - 广播电视台
    - 广播电视总台
    - 日报社
    - 发布中心
  # 判定说明(避免口径争议):
  #   - "文化和旅游信息中心/数据中心"(如重庆文旅) → **target**: 属文旅系统下属事业单位
  #   - "融媒体中心/广播电视台"(如云南红河发布) → **borderline**: 属宣传/新闻系统, 非文旅主体


# 标注任务: 视频类别 (无序枚举分类)
# 标签枚举可自由增删(修改后 prompt_ver 变化 → 缓存自动失效重标)
task_id: video_category
name: 视频类别
level: video
input_field: caption
labels:
  景点介绍: 介绍某个景点/景区
  旅游攻略: 行程/路线/实用信息
  美食: 美食探店/地方菜
  地方文化: 非遗/民俗/歌舞/历史
  节庆活动: 节庆/赛事/活动
  自然风光: 纯风景
  人物工作人员: 以人物/工作人员为主角
  政务宣传: 政务信息/政策宣传
  新闻资讯: 新闻报道
  娱乐热点: 玩梗/热点/搞笑
  其他: 以上都不是
output_fields: [label, why]
prompt_hint: |
  - 只能依据文案判断; 文案信息不足时选"其他"并说明
  - 一条视频只选一个最主要类别
max_input_chars: 500

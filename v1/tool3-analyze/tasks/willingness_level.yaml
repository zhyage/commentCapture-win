# 标注任务: 评论意愿分级 (有序分类)
# 标签体系可自由修改(通用性要求: 不绑定任何具体研究框架)
task_id: willingness_level
name: 意愿分级
level: comment
input_field: text
labels:
  0: 无意愿
  1: 兴趣
  2: 明确意愿
  3: 行动意愿
  4: 计划性意愿
output_fields: [level, why]
prompt_hint: |
  - "太美了""哈哈哈文案绝了" = 0 (纯赞美/调侃, 无旅游意愿)
  - "去过了, 确实漂亮" = 0 (非未来意愿)
  - 纯表情/无意义 = 0
  - "好想去看看" = 1 (兴趣)
  - "以后一定要去" = 2 (明确意愿)
  - "准备下个月去" = 3 (行动意愿)
  - "国庆去红河, 有没有住宿推荐?" = 4 (计划性意愿)
  - 只能依据评论文本判断, 不要脑补
max_input_chars: 500
